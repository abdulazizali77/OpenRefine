<div class="grid-layout layout-tight"><div role="presentation">
      <div><span colspan="2" id="or-import-colsep"></span></div>
         
      <div><span width="1%"><input type="checkbox" bind="wikiCheckbox" id="$reconcileWiki" /></span><span><label for="$reconcileWiki" id="or-import-wiki-base-url"></label>
        <input bind="wikiUrlInput" spellcheck="false" type="text" class="lightweight" size="30" id="$wikiUrl" /></span></div>

      <div><span width="1%"><input type="checkbox" bind="headerLinesCheckbox" id="$headers" /></span>
        <span><label for="$headers" id="or-import-parse"></label>
          <input bind="headerLinesInput" type="number" class="lightweight" size="7" value="1" />
          <label for="$headers" id="or-import-header"></label></span></div>
      <div><span width="1%"><input type="checkbox" bind="limitCheckbox" id="$limit" /></span>
        <span><label for="$limit" id="or-import-load"></label>
          <input bind="limitInput" type="number" class="lightweight" size="7" value="0" />
          <label for="$limit" id="or-import-rows2"></label></span></div>
      <div><span width="1%"><input type="checkbox" bind="guessCellValueTypesCheckbox" id="$guess" /></span>
        <span><label for="$guess" id="or-import-parseCell"></label></span></div>
      <div><span width="1%"><input type="checkbox" bind="blankSpanningCellsCheckbox" id="$blank-spanning-cells" /></span>
        <span><label for="$blank-spanning-cells" id="or-import-blankSpanningCells"></label></span></div>
      <div><span width="1%"><input type="checkbox" bind="storeBlankRowsCheckbox" id="$store-blank-rows" /></span>
        <span colspan="2"><label for="$store-blank-rows" id="or-import-blank"></label></span></div>
      <div><span width="1%"><input type="checkbox" bind="storeBlankColumnsCheckbox" id="$store-blank-columns" /></span>
        <span colspan="2"><label for="$store-blank-columns" id="or-import-blank-columns"></label></span></div>
      <div><span width="1%"><input type="checkbox" bind="includeRawTemplatesCheckbox" id="$include-raw-templates" /></span>
        <span colspan="2"><label for="$include-raw-templates" id="or-import-includeRawTemplates"></label></span></div>
      <div><span width="1%"><input type="checkbox" bind="parseReferencesCheckbox" id="$parse-references" /></span>
        <span colspan="2"><label for="$parse-references" id="or-import-parseReferences"></label></span></div>

      <div><span width="1%"><input type="checkbox" bind="storeBlankCellsAsNullsCheckbox" id="$store-blank-cells" /></span>
        <span colspan="2"><label for="$store-blank-cells" id="or-import-null"></label></span></div>
        
      <div><span width="1%"><input type="checkbox" bind="includeFileSourcesCheckbox" id="$include-file-sources" /></span>
        <span><label for="$include-file-sources" id="or-import-source"></label></span></div>

      <div><span width="1%"><input type="checkbox" bind="includeArchiveFileCheckbox" id="$include-archive-file" /></span>
        <span><label for="$include-archive-file" id="or-import-archive"></label></span></div>

      <div>
        <span width="1%"></span>
        <span><button class="button" bind="previewButton"></button></span>
      </div>
      <div>
          <span width="1%"></span>
          <span ><input type="checkbox" bind="disableAutoPreviewCheckbox" id="$disable" />
            <label for="$disable" id="or-disable-auto-preview"></label></span>
      </div>
</div></div>
